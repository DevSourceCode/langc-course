[project]
name = "langc-course"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "langchain>=1.4.7",
    "langchain-anthropic>=1.7.7",
    "langchain-community>=0.4.2",
    "langchain-core>=1.7.3",
    "langchain-openai>=1.7.3",
    "langgraph>=1.2.19",
    "pypdf>=7.0.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
langc-course = "foundation_langc_course:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["foundation_langc_course", "building_rag_memory_systems"]
